<!DOCTYPE html>
<html>

<head>
  <title>Rewards</title>
  <link rel="stylesheet" href="dashboared.css">

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      margin: 10px 0;
      color: #000;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .card p {
      color: #000;
    }

    .empty {
      text-align: center;
      margin-top: 30px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="phone">

  <header>
    <div class="logo">
      <img src="assets/logo.png" alt="">
    </div>
  </header>

  <h2>🎁 Your Rewards</h2>

  <div id="rewardBox">Loading...</div>

  <div class="nav">
    <a href="dhashboard.html">
      <div>🏠<br>Home</div>
    </a>
    <a href="histroy.html">
      <div>🕘<br>History</div>
    </a>
    <a href="./reward.html">
      <div class="active">🎁<br>Reward</div>
    </a>
    <a href="profile.html">
      <div>👤<br>Profile</div>
    </a>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

// 🔥 Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyBVgzkGtL0fZ9HogTXrsFuUg0QGS-XZUT8",
  authDomain: "taj-loyality.firebaseapp.com",
  projectId: "taj-loyality",
  storageBucket: "taj-loyality.appspot.com",
  messagingSenderId: "23994370093",
  appId: "1:23994370093:web:d11393abd2768513e490a4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔐 SAME STABLE METHOD
setPersistence(auth, browserLocalPersistence);

onAuthStateChanged(auth, (user) => {

  const box = document.getElementById("rewardBox");

  if (user) {

    console.log("User logged in:", user.uid);

    const name = user.displayName || user.email || "User";

    loadRewards(user.uid, name);

  } else {

    setTimeout(() => {

      if (auth.currentUser) {

        const user = auth.currentUser;

        const name = user.displayName || user.email || "User";

        console.log("Recovered user:", user.uid);

        loadRewards(user.uid, name);

      } else {

        console.log("User really not logged in");

        box.innerHTML = `<div class="empty">Please login first</div>`;
      }

    }, 800);

  }

});


// ✅ LOAD REWARDS
async function loadRewards(uid, userName) {

  const box = document.getElementById("rewardBox");

  try {

    const q = query(
      collection(db, "complete_reward"),
      where("userId", "==", uid)
    );

    const snapshot = await getDocs(q);

    if (snapshot.empty) {
      box.innerHTML = `<div class="empty">No rewards yet</div>`;
      return;
    }

    let html = "";

    for (const docSnap of snapshot.docs) {

      const data = docSnap.data();

      if (data.userId !== uid) continue;

      const branchRef = doc(db, "branch_rewards", data.branch);
      const branchSnap = await getDoc(branchRef);

      if (!branchSnap.exists()) continue;

      const branchData = branchSnap.data();

      if (!branchData[data.plan]) continue;

      const reward = branchData[data.plan];

      html += `
        <div class="card">
          <h3>🎁 Reward: ${reward.reward}</h3>
          <p><strong>Name:</strong> ${userName}</p>
          <p><strong>Branch:</strong> ${data.branch}</p>
          <p><strong>Plan:</strong> ${data.plan}</p>
        </div>
      `;
    }

    box.innerHTML = html;

  } catch (err) {
    console.error(err);
    box.innerHTML = `<div class="empty">Error loading rewards</div>`;
  }
}

</script>

</body>
</html>
