<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner</title>
    <link rel="stylesheet" href="dashboared.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        #pageLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 9999;

            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }

        #pageLoader.active {
            opacity: 1;
            pointer-events: all;
        }

        .loader-box {
            text-align: center;
            color: white;
            font-family: sans-serif;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #ffffff50;
            border-top: 5px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }
        #saveBtn{
            width: 40%;
        }
        #plan {
            padding: 5px;
            width: 40%;
            border: 1px dashed;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="phone" id="contain">
        <div id="pageLoader">
            <div class="loader-box">
                <div class="spinner"></div>
                <p>Saving data...</p>
            </div>
        </div>
        <header>
            <div class="logo">
                <img src="assets/logo.png" alt="Loading">
            </div>
        </header>
        <div id="reader" style="width:500px;margin:auto;"></div>
        <div id="box"></div>

        <div class="nav">

            <a href="dhashboard.html">
                <div>🏠<br>Home</div>
            </a>
            <a href="histroy.html">
                <div>🕘<br>History</div>
            </a>
            <a href="./reward.html">
                <div>🎁<br>Reward</div>
            </a>
            <a href="profile.html">
                <div>👤<br>Profile</div>
            </a>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</body>
<script>
    function toggleHeight() {
        const btn = document.getElementById("html5-qrcode-button-camera-start");
        const box = document.getElementById('contain')
        btn.addEventListener(function name(params) {
            if (box.style.minHeight === "1185px") {
                box.style.minHeight = "760px";
            } else {
                box.style.minHeight = "1185px";
            }
        })
    }





</script>
<script type="module" src="scan.js">

</script>

</html>
