<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import {
        getAuth,
        onAuthStateChanged,
        signOut,
        setPersistence,
        browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    // 🔥 YOUR FIREBASE CONFIG (replace this)
    const firebaseConfig = {
        apiKey: "AIzaSyBVgzkGtL0fZ9HogTXrsFuUg0QGS-XZUT8",
        authDomain: "taj-loyality.firebaseapp.com",
        projectId: "taj-loyality",
        storageBucket: "taj-loyality.appspot.com",
        messagingSenderId: "23994370093",
        appId: "1:23994370093:web:d11393abd2768513e490a4"
    };

    // INIT FIREBASE
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // 🔐 KEEP USER LOGGED IN
    setPersistence(auth, browserLocalPersistence);

    // ⏳ WAIT FOR AUTH STATE (IMPORTANT FIX)
    onAuthStateChanged(auth, (user) => {

        if (user) {
            document.getElementById("userName").innerText =
                `Hi, ${user.displayName} 👋` || "No Name";
        }

        else {
            // ONLY REDIRECT IF REALLY NOT LOGGED IN
            setTimeout(() => {
                if (!auth.currentUser) {
                    console.log("u r not login");

                }
            }, 800);
        }
    });


</script>
