<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SM / SS Reward Speedometer</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="admin.css">
    <style>
        body {
            margin: 0;
            font-family: Poppins, sans-serif;
            background: #f3f3f3;
        }

        .header {
            background: #111827;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
        }

        .container {
            display: grid;
            gap: 25px;
            padding: 20px;
        }

        /* ===== GAUGE ===== */
        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .title {
            font-weight: 600;
            margin-bottom: 15px;
        }

        /* SPEEDOMETER BASE */
        .speedometer {
            width: 180px;
            height: 90px;
            margin: auto;
            position: relative;
            overflow: hidden;
        }

        .arc {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: #e5e7eb;
            position: absolute;
            top: 0;
            left: 0;
            clip-path: inset(0 0 50% 0);
        }

        /* NEEDLE */
        .needle {
            width: 3px;
            height: 70px;
            background: red;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform-origin: bottom;
            transform: rotate(-90deg);
            transition: 0.8s ease;
            border-radius: 5px;
        }

        .center-dot {
            width: 12px;
            height: 12px;
            background: #111827;
            border-radius: 50%;
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
        }

        .center {
            margin-top: 10px;
            font-weight: bold;
        }

        .status {
            font-size: 13px;
            color: gray;
        }

        /* BUTTON */
        #rewardBox {
            text-align: center;
            display: none;
            margin-top: 20px;
        }

        #buyBtn {
            padding: 12px 25px;
            background: #16a34a;
            color: white;
            border-radius: 10px;
            font-size: 16px;
        }

        #buyBtn:disabled {
            background: gray;
            cursor: not-allowed;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <div class="sidebar">

        <div class="sidebar-top">
            <h2>Hi, <span id="branchName">Branch</span></h2>
            <p>Welcome Back</p>
        </div>

        <a href="allUser.html">
            <div class="menu-item">All User</div>
        </a>

        <div class="menu-item dropdown-btn">

            <span>Inprogress User</span>

            <span class="arrow">▲</span>

        </div>
        <div class="dropdown-content">

            <a href="insilver.html">
                <div class="sub-item">Silver</div>
            </a>

            <a href="inGold.html">
                <div class="sub-item">Gold</div>
            </a>

            <a href="inplatinum.html">

                <div class="sub-item">Platinum</div>
            </a>

        </div>
        <div class="menu-item dropdown-btn">
            <span>Complete User</span>
            <span class="arrow">▲</span>
        </div>



        <div class="dropdown-content">

            <a href="complete_silver.html">
                <div class="sub-item">Silver</div>
            </a>

            <a href="complete_gold.html">
                <div class="sub-item">Gold</div>
            </a>

            <a href="complete_platinum.html">
                <div class="sub-item">Platinum</div>
            </a>

        </div>
        <a href="editReward.html">
            <div class="menu-item">
                Edit Reward
            </div>
        </a>

        <a href="staffReward.html">
            <div class="menu-item">
                S.M \ S.S Reward
            </div>
        </a>
        <a href="setEvevenDate.html">
            <div class="menu-item">
                Set Event Date
            </div>
        </a>
    </div>
    <div class="main">
        <div class="logo">
            <img src="assets/logo.png" alt="">
        </div>

        <div class="container">

            <!-- SILVER -->
            <div class="card">
                <div class="title">Silver (45)</div>

                <div class="speedometer">
                    <div class="arc"></div>
                    <div class="needle" id="silverNeedle"></div>
                    <div class="center-dot"></div>
                </div>

                <div class="center" id="silverText">0 / 45</div>
                <div class="status" id="silverStatus"></div>
            </div>

            <!-- GOLD -->
            <div class="card">
                <div class="title">Gold (40)</div>

                <div class="speedometer">
                    <div class="arc"></div>
                    <div class="needle" id="goldNeedle"></div>
                    <div class="center-dot"></div>
                </div>

                <div class="center" id="goldText">0 / 40</div>
                <div class="status" id="goldStatus"></div>
            </div>

            <!-- PLATINUM -->
            <div class="card">
                <div class="title">Platinum (20)</div>

                <div class="speedometer">
                    <div class="arc"></div>
                    <div class="needle" id="platinumNeedle"></div>
                    <div class="center-dot"></div>
                </div>

                <div class="center" id="platinumText">0 / 20</div>
                <div class="status" id="platinumStatus"></div>
            </div>

        </div>

        <div id="rewardBox">
            <a href="ads.html">

                <button id="buyBtn" style="background-color: black;">🎁 Buy Reward</button>
            </a>
            <p>Get your discounted products here and this Reward giving by us</p>
        </div>
    </div>
    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyBVgzkGtL0F9HogTXrsFuUg0QGS-XZUT8",
            authDomain: "taj-loyality.firebaseapp.com",
            projectId: "taj-loyality",
            storageBucket: "taj-loyality.appspot.com",
            messagingSenderId: "23994370093",
            appId: "1:23994370093:web:d11393abd2768513e490a4"
        });

        const db = getFirestore(app);

        document.getElementById("branchName").innerText =
            localStorage.getItem("adminBranch") || "";

        function normalize(v) {
            return (v || "").toString().replace(/[^0-9]/g, "");
        }
        function getMonthKey() {
            const now = new Date();
            return `${now.getFullYear()}-${now.getMonth() + 1}`;
        }

        function isUnlockedThisMonth() {
            const key = "reward_unlock_" + localStorage.getItem("adminBranch") + "_" + getMonthKey();
            return localStorage.getItem(key) !== null;
        }
        async function load() {

            const snap = await getDocs(collection(db, "complete_reward"));

            const branch = normalize(localStorage.getItem("adminBranch"));

            let silver = 0, gold = 0, platinum = 0;

            snap.forEach(doc => {

                const d = doc.data();

                if (normalize(d.branch) !== branch) return;

                const plan = (d.plan || "").toLowerCase();

                if (plan === "silver") silver++;
                if (plan === "gold") gold++;
                if (plan === "platinum") platinum++;
            });

            updateGauge("silverNeedle", silver, 45, "silverText", "silverStatus");
            updateGauge("goldNeedle", gold, 40, "goldText", "goldStatus");
            updateGauge("platinumNeedle", platinum, 20, "platinumText", "platinumStatus");

            const allDone =
                silver >= 45 &&
                gold >= 40 &&
                platinum >= 20;

            const rewardBox = document.getElementById("rewardBox");
            const buyBtn = document.getElementById("buyBtn");

            rewardBox.style.display = "block";

            // =========================
            // MONTHLY SYSTEM (NEW)
            // =========================
            const monthKey = getMonthKey();
            const unlockKey = "reward_unlock_" + branch + "_" + monthKey;

            // auto unlock once per month when completed
            if (allDone && !localStorage.getItem(unlockKey)) {
                localStorage.setItem(unlockKey, Date.now());
            }

            const isUnlocked = localStorage.getItem(unlockKey);

            // =========================
            // BUTTON LOGIC
            // =========================
            if (allDone && isUnlocked) {

                buyBtn.disabled = false;
                buyBtn.innerText = "🎁 Buy Reward";
                buyBtn.style.opacity = "1";
                buyBtn.style.cursor = "pointer";

            } else if (allDone && !isUnlocked) {

                buyBtn.disabled = true;
                buyBtn.innerText = "⏳ Waiting for unlock";
                buyBtn.style.opacity = "0.5";
                buyBtn.style.cursor = "not-allowed";

            } else {

                buyBtn.disabled = true;
                buyBtn.innerText = "🔒 Locked";
                buyBtn.style.opacity = "0.5";
                buyBtn.style.cursor = "not-allowed";
            }
        }

        const snap = await getDocs(collection(db, "complete_reward"));

        const branch = normalize(localStorage.getItem("adminBranch"));

        let silver = 0, gold = 0, platinum = 0;

        snap.forEach(doc => {

            const d = doc.data();

            if (normalize(d.branch) !== branch) return;

            const plan = (d.plan || "").toLowerCase();

            if (plan === "silver") silver++;
            if (plan === "gold") gold++;
            if (plan === "platinum") platinum++;
        });

        updateGauge("silverNeedle", silver, 45, "silverText", "silverStatus");
        updateGauge("goldNeedle", gold, 40, "goldText", "goldStatus");
        updateGauge("platinumNeedle", platinum, 20, "platinumText", "platinumStatus");

        const allDone =
            silver >= 45 &&
            gold >= 40 &&
            platinum >= 20;

        const rewardBox = document.getElementById("rewardBox");
        const buyBtn = document.getElementById("buyBtn");

        rewardBox.style.display = "block";

        if (allDone) {
            buyBtn.disabled = false;
            buyBtn.innerText = "🎁 Buy Reward";
            buyBtn.style.opacity = "1";
            buyBtn.style.cursor = "pointer";
        } else {
            buyBtn.disabled = true;
            buyBtn.innerText = "🔒 Locked";
            buyBtn.style.opacity = "0.5";
            buyBtn.style.cursor = "not-allowed";
        }


        /* ===== NEEDLE ROTATION (IMPORTANT) ===== */
        function updateGauge(needleId, value, target, textId, statusId) {

            const percent = Math.min(value / target, 1);

            // -90 to +90 degree (speedometer range)
            const angle = -90 + (percent * 180);

            document.getElementById(needleId).style.transform =
                `rotate(${angle}deg)`;

            document.getElementById(textId).innerText =
                `${value} / ${target}`;

            document.getElementById(statusId).innerHTML =
                value >= target ? "🎉 Completed" : "In Progress";
        }

        document.getElementById("buyBtn").onclick = () => {

        };

        load();
const dropdownBtns =
            document.querySelectorAll(".dropdown-btn");

        dropdownBtns.forEach((btn) => {

            btn.addEventListener("click", () => {

                const dropdown =
                    btn.nextElementSibling;

                const arrow =
                    btn.querySelector(".arrow");



                if (dropdown.style.display === "block") {

                    dropdown.style.display = "none";

                    arrow.classList.remove("rotate");

                } else {

                    dropdown.style.display = "block";

                    arrow.classList.add("rotate");

                }

            });

        });
    </script>

</body>

</html>
